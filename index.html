<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sales Analytics Dashboard</title>
  <link href="https://cdn.webdatarocks.com/latest/webdatarocks.min.css" rel="stylesheet"/>
  <script src="https://cdn.webdatarocks.com/latest/webdatarocks.js"></script>
</head>

<body>
  <h1> Sales Analytics Dashboard</h1>
  <div id="pivot-container">



  </div>








  <script>
    var pivot = new WebDataRocks({
      container: "#pivot-container",
      toolbar: true,
      width: "100%",
      height: 500,
      report: {
        dataSource: {
          data: [
            { "Country": "Pakistan", "Product": "Website", "Sales": 20000 },
            { "Country": "USA", "Product": "Shopify Store", "Sales": 8000 },
            { "Country": "UK", "Product": "WordPress Site", "Sales": 4500 },
            { "Country": "Pakistan", "Product": "Shopify Store", "Sales": 6200 },
            { "Country": "UAE", "Product": "Website", "Sales": 7300 },
            { "Country": "Pakistan", "Product": "Mobiles", "Sales": 100 }
          ]
        },
        slice: {
          rows: [{ uniqueName: "Country" }],
          columns: [{ uniqueName: "Product" }],
          measures: [{ uniqueName: "Sales", aggregation: "sum" }]
        }
      }
    });
  </script>
</body>
</html>
